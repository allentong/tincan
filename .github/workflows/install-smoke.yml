name: install-smoke

on:
  # Monthly: 1st of each month at 08:00 UTC
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install from release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TINCAN_UPDATES: "off"
        run: |
          set -euo pipefail
          HOME_ROOT="${RUNNER_TEMP}/tincan-isolated-home"
          rm -rf "$HOME_ROOT"
          mkdir -p "$HOME_ROOT/.local/bin"
          export HOME="$HOME_ROOT"
          export USERPROFILE="$HOME_ROOT"
          export TINCAN_INSTALL_DIR="$HOME_ROOT/.local/bin"
          export PATH="$TINCAN_INSTALL_DIR:$PATH"
          export TINCAN_OWNER_PID=0

          start=$(date +%s)
          bash "$GITHUB_WORKSPACE/install.sh"
          end=$(date +%s)
          install_seconds=$((end - start))
          echo "install_seconds=$install_seconds" >> "$GITHUB_ENV"

          version_out="$("$TINCAN_INSTALL_DIR/tincan" --version)"
          echo "version_out=$version_out" >> "$GITHUB_ENV"
          command -v tincan >/dev/null
          test "$(command -v tincan)" = "$TINCAN_INSTALL_DIR/tincan"

          if "$TINCAN_INSTALL_DIR/tincan" install-skills >/dev/null; then
            echo "install_skills=ok" >> "$GITHUB_ENV"
          else
            echo "install_skills=failed" >> "$GITHUB_ENV"
            exit 1
          fi

          TEAM_DIR="$(mktemp -d)"
          export TINCAN_TEAM_DIR="$TEAM_DIR"
          tincan init
          tincan register alice --harness claude --pid 0
          tincan register bob --harness codex --pid 0

          send_json="$(tincan --as alice send bob "install-smoke" --no-launch)"
          echo "$send_json" | jq -e '.ok == true and .id != null'
          msg_id="$(echo "$send_json" | jq -r .id)"

          inbox_json="$(tincan --as bob inbox --require-ack)"
          echo "$inbox_json" | jq -e --arg id "$msg_id" '.messages | length == 1 and .[0].id == $id and .[0].body == "install-smoke"'

          reply_json="$(tincan --as bob send alice "pong" --reply-to "$msg_id" --no-launch)"
          echo "$reply_json" | jq -e '.ok == true and .hop == 1'

          ack_json="$(tincan --as bob ack "$msg_id")"
          echo "$ack_json" | jq -e '.acked == 1'

          echo "round_trip=ok" >> "$GITHUB_ENV"

      - name: Install from release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TINCAN_UPDATES: "off"
        run: |
          $ErrorActionPreference = 'Stop'
          $homeRoot = Join-Path $env:RUNNER_TEMP 'tincan-isolated-home'
          if (Test-Path $homeRoot) { Remove-Item -Recurse -Force $homeRoot }
          New-Item -ItemType Directory -Force -Path (Join-Path $homeRoot '.local\bin') | Out-Null
          $env:HOME = $homeRoot
          $env:USERPROFILE = $homeRoot
          $env:LOCALAPPDATA = Join-Path $homeRoot 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $installDir = Join-Path $env:LOCALAPPDATA 'tincan\bin'
          $env:TINCAN_INSTALL_DIR = $installDir
          $env:PATH = "$installDir;$env:PATH"
          $env:TINCAN_OWNER_PID = '0'

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & (Join-Path $env:GITHUB_WORKSPACE 'install.ps1')
          $sw.Stop()
          $installSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 3)
          "install_seconds=$installSeconds" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $tincan = Join-Path $installDir 'tincan.exe'
          if (-not (Test-Path $tincan)) { throw "missing $tincan" }
          $versionOut = & $tincan --version
          "version_out=$versionOut" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $onPath = (Get-Command tincan.exe -ErrorAction SilentlyContinue).Source
          if ($onPath -ne $tincan) { throw "tincan not on PATH at expected location: $onPath vs $tincan" }

          & $tincan install-skills | Out-Null
          if ($LASTEXITCODE -ne 0) {
            "install_skills=failed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 1
          }
          "install_skills=ok" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $teamDir = Join-Path $env:RUNNER_TEMP ("tincan-team-{0}" -f [guid]::NewGuid())
          New-Item -ItemType Directory -Path $teamDir | Out-Null
          $env:TINCAN_TEAM_DIR = $teamDir
          & $tincan init
          if ($LASTEXITCODE -ne 0) { throw "tincan init failed" }
          & $tincan register alice --harness claude --pid 0 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "register alice failed" }
          & $tincan register bob --harness codex --pid 0 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "register bob failed" }

          $sendJson = & $tincan --as alice send bob 'install-smoke' --no-launch | ConvertFrom-Json
          if (-not $sendJson.ok -or -not $sendJson.id) { throw "send failed: $($sendJson | ConvertTo-Json -Compress)" }
          $msgId = $sendJson.id

          $inboxJson = & $tincan --as bob inbox --require-ack | ConvertFrom-Json
          if ($inboxJson.messages.Count -ne 1) { throw "inbox expected 1 message" }
          if ($inboxJson.messages[0].id -ne $msgId -or $inboxJson.messages[0].body -ne 'install-smoke') {
            throw "inbox payload mismatch"
          }

          $replyJson = & $tincan --as bob send alice 'pong' --reply-to $msgId --no-launch | ConvertFrom-Json
          if (-not $replyJson.ok -or $replyJson.hop -ne 1) { throw "reply failed: $($replyJson | ConvertTo-Json -Compress)" }

          $ackJson = & $tincan --as bob ack $msgId | ConvertFrom-Json
          if ($ackJson.acked -ne 1) { throw "ack expected acked=1" }

          "round_trip=ok" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## install-smoke (${{ matrix.os }})"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Install seconds | ${install_seconds:-n/a} |"
            echo "| \`tincan --version\` | ${version_out:-n/a} |"
            echo "| install-skills | ${install_skills:-n/a} |"
            echo "| Round trip (send → inbox → reply → ack) | ${round_trip:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
