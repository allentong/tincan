[package]
name = "tincan"
version = "0.1.0"
edition = "2024"
description = "Local, daemonless message bus between AI coding agent sessions"
license = "MIT"
repository = "https://github.com/allentong/tincan"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
